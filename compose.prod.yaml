services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-BO"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
      target: production
    env_file: .env.docker
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-c", "print('Migraciones aplicadas correctamente.')"]
    restart: "no"

  backend:
    build:
      context: ./backend
      target: production
    init: true
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
      COLLECT_STATIC: "1"
      TRUST_PROXY_HEADERS: "True"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${HTTP_PORT_EXTERNAL:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      target: production
    profiles: ["tools"]
    env_file: .env.docker
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "cargar_semilla"]
    restart: "no"

volumes:
  postgres_data:
