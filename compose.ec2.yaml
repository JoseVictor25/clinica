x-backend: &backend
  build:
    context: ./backend
    target: production
  env_file: ${EC2_ENV_FILE:-.env.ec2}
  environment:
    DEBUG: "False"
    DB_HOST: db
    DB_PORT: 5432
    TRUST_PROXY_HEADERS: "True"
  networks:
    - data

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${EC2_ENV_FILE:-.env.ec2}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-BO"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  migrate:
    <<: *backend
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-c", "print('Migraciones aplicadas correctamente.')"]
    restart: "no"
    logging: *default-logging

  backend:
    <<: *backend
    init: true
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
      COLLECT_STATIC: "1"
      TRUST_PROXY_HEADERS: "True"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

  seed:
    <<: *backend
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "cargar_semilla"]
    restart: "no"
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  web:
  data:
    internal: true
